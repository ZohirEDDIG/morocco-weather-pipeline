services:
    postgres:
        image: postgres:16
        container_name: weather_postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${WAREHOUSE_DB}
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./postgres/init:/docker-entrypoint-initdb.d
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${WAREHOUSE_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
    ingestion:
        build: ./ingestion
        profiles: ["tools"]
        env_file: .env
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
        - ./ingestion:/app/ingestion

volumes:
    pgdata: